[package]
name = "sentiment_amm"
version = "0.1.0"
description = "Sentiment market AMM: Believe + Doubt = $1 perpetual two-sided market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sentiment_amm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
